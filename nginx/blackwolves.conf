upstream blackwolves_app {
    server 127.0.0.1:8000;
}

map "$request_method:$uri" $write_limit_key {
    default "";
    "~^POST:/" $binary_remote_addr;
}

map "$request_method:$uri" $login_limit_key {
    default "";
    "~^POST:/login$" $binary_remote_addr;
}

limit_req_zone $write_limit_key zone=blackwolves_writes:10m rate=30r/m;
limit_req_zone $login_limit_key zone=blackwolves_login:10m rate=5r/m;

server {
    listen 80;
    server_name blackwolves.com.br www.blackwolves.com.br;
    client_max_body_size 27m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /home/blackwolves/BlackwolvesSite/static/;
        expires -1;
        access_log off;
    }

    location / {
        limit_req zone=blackwolves_writes burst=10 nodelay;
        limit_req zone=blackwolves_login burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://blackwolves_app;
        proxy_redirect off;
    }
}
